name: Verify independent format library
on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  msrv:
    name: Rust 1.88 minimum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo test --locked --workspace --all-targets --all-features
  crates:
    name: Published crate contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.90.0
      - run: python3 scripts/test_release.py
      - run: python3 scripts/verify_crates.py
      - uses: actions/upload-artifact@v4
        with:
          name: crate-packages
          path: |
            target/package/*.crate
            evidence/local/crate-packages/receipt.json
  extraction:
    name: Bounded extraction and historical replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact checked-out head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 scripts/verify_extraction.py run --evidence evidence/local/verify-extraction
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bounded-extraction-evidence
          path: evidence/local/verify-extraction/
  portable:
    name: Portable (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checked-out head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-targets
      - run: cargo test --locked --workspace --all-targets --all-features
      - run: python scripts/test_google_differential_contract.py
      - run: python scripts/external_consumer.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: python scripts/test_java.py
      - run: python scripts/test_c_abi.py
      - run: python scripts/package_native.py
      - name: Verify packaged release SDK and external Java consumer
        shell: bash
        run: python scripts/test_packaged_sdk.py dist/*-sdk.zip
      - name: Inspect independent packet reader
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 5
        shell: bash
        run: |
          if ! command -v ffprobe; then
            apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60)
            sudo apt-get "${apt_options[@]}" update
            sudo apt-get "${apt_options[@]}" install -y --no-install-recommends ffmpeg
          fi
          ffprobe -version
      - name: Reproducible CLI syntax and independent packet/index/time contracts
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/test_syntax_contracts.py
      - uses: actions/upload-artifact@v4
        with:
          name: native-sdk-${{ matrix.os }}
          path: |
            dist/*-sdk.zip
            dist/*-sdk.zip.sha256
            dist/*-sdk.zip.receipt.json
            evidence/local/syntax-contracts-*/receipt.json
  fixtures:
    name: Exact original fixture round trips
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checked-out head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 scripts/fixtures.py --fetch
      - run: cargo test --locked -p liblivephoto --test fixtures -- --ignored --nocapture
  fuzz:
    name: Sanitizer and coverage campaign
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checked-out head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - run: bash scripts/fuzz.sh 60 evidence/local/ci-fuzz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sanitizer-coverage-logs
          path: evidence/local/ci-fuzz/*.log
