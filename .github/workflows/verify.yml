name: Verify independent format library
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable:
    name: Portable (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-targets
      - run: cargo test --locked --workspace --all-targets --all-features
      - run: python scripts/external_consumer.py
  fixtures:
    name: Exact original fixture round trips
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 scripts/fixtures.py --fetch
      - run: cargo test --locked -p liblivephoto --test fixtures -- --ignored --nocapture
  fuzz:
    name: Sanitizer and coverage campaign
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - run: bash scripts/fuzz.sh 60 evidence/local/ci-fuzz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sanitizer-coverage-logs
          path: evidence/local/ci-fuzz/*.log
