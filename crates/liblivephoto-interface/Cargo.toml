[package]
name = "liblivephoto-interface"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared operation protocol for CLI, JNI and native adapters"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
liblivephoto = { path = "../liblivephoto", version = "0.1.0" }
liblivephoto-bridge = { path = "../liblivephoto-bridge", version = "0.1.0" }
serde_json = "1.0"
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.104"
[lints]
workspace = true

[dev-dependencies]
liblivephoto-format = { path = "../liblivephoto-format", version = "0.1.0" }
