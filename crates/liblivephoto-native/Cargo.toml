[package]
name = "liblivephoto-native"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Isolated C and JNI boundary for LibLivePhoto operation protocol"
[lib]
name = "livephoto_native"
crate-type = ["cdylib", "staticlib", "rlib"]
[dependencies]
liblivephoto-interface = { path = "../liblivephoto-interface", version = "0.1.0" }
jni = { version = "0.21.1", default-features = false }
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
