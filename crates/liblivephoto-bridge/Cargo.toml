[package]
name = "liblivephoto-bridge"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
include = ["Cargo.toml", "README*.md", "LICENSE", "src/**", "tests/**", "examples/**"]
license.workspace = true
repository.workspace = true
description = "Owned inspection and exact timing contract for native and local web clients"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
liblivephoto = { path = "../liblivephoto", version = "0.1.0" }
serde_json = "1.0"
[dev-dependencies]
liblivephoto-format = { path = "../liblivephoto-format", version = "0.1.0" }
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.104"
[lints]
workspace = true
